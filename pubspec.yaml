name: doku
description: DOKU (Dompet Saku) - aplikasi pencatat keuangan harian.
publish_to: 'none'

version: 1.2.0+9

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  google_fonts: ^8.2.1
  fl_chart: ^1.3.0
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  google_mobile_ads: ^9.2.0
  shared_preferences: ^2.5.6
  excel_community: ^2.6.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  sqflite_common_ffi: any

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  color_dark: "#101714"
  android: true
  ios: false
  web: false
  android_12:
    image: assets/splash/splash_android12.png
    color: "#FFFFFF"
    color_dark: "#101714"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/onboarding/
